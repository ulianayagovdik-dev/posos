<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: одна колонка ~760px, сверху вкладки, экзамен — лист с вопросами, прогресс — сводка + графики */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#151a2e; --muted:#5c637a; --line:#dde0ea;
  --accent:#2b44d6; --accent-soft:#e6e9fb; --mark:#ffe36b;
  --good:#16884a; --good-soft:#e2f4ea; --bad:#c5352b; --bad-soft:#fbe6e4; --warn:#a86a00;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#181c2e; --ink:#e8eaf4; --muted:#9aa1ba; --line:#2b3150;
  --accent:#8b9bff; --accent-soft:#232a52; --mark:#e8c840;
  --good:#4fcf86; --good-soft:#163627; --bad:#ff7d72; --bad-soft:#3c1d1c; --warn:#f0b54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#181c2e; --ink:#e8eaf4; --muted:#9aa1ba; --line:#2b3150;
  --accent:#8b9bff; --accent-soft:#232a52; --mark:#e8c840;
  --good:#4fcf86; --good-soft:#163627; --bad:#ff7d72; --bad-soft:#3c1d1c; --warn:#f0b54a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:780px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
nav button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:7px 12px;border-radius:7px;cursor:pointer}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
button:focus-visible,label:focus-within,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.2}
h2{font-family:var(--display);font-weight:500;font-size:18px}
.lead{color:var(--muted);max-width:62ch;margin:8px 0 0}
.section{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:10px 16px;border-radius:9px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1220}}
.btn:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--bad-soft);color:var(--bad)}
.examhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q.ok{border-color:var(--good)} .q.no{border-color:var(--bad)}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qt{font-weight:600}
.hint{font-size:13px;color:var(--muted)} .hint b{color:var(--bad);font-weight:700}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt .ltr{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrongpick{border-color:var(--bad);background:var(--bad-soft)}
.expl{font-size:14px;border-left:3px solid var(--mark);padding:4px 0 4px 10px;color:var(--ink)}
.expl .u{color:var(--warn);font-weight:600}
textarea{width:100%;min-height:120px;font:15px/1.5 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.plan{background:var(--bg);border-radius:8px;padding:10px 14px}
.plan ul{margin:6px 0 0;padding-left:18px}
.selfscore{display:flex;gap:6px;flex-wrap:wrap}
.selfscore button{width:40px;height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:600 14px var(--mono);cursor:pointer}
.selfscore button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.result{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.big{font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pass{color:var(--good)} .fail{color:var(--bad)}
.blocks{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
@media (max-width:480px){.brow{grid-template-columns:minmax(0,1fr) 56px}.brow .bar{grid-column:1/-1;order:3}}
.brow .num{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.hist{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg text{fill:var(--muted);font:11px var(--mono)}
.empty{color:var(--muted)}
.bankq{border-bottom:1px solid var(--line);padding-block:10px}
.bankq:last-child{border:0}
.bankq .ans{font-size:13px;color:var(--good);font-weight:600}
select{font:14px var(--body);padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div class="brand">Тренажёр ПОС<small>Профессия менеджера в современном мире · ВШБ</small></div>
  <nav aria-label="Разделы">
    <button id="tab-home" data-view="home" aria-current="true">Главная</button>
    <button id="tab-exam" data-view="exam">Вариант</button>
    <button id="tab-progress" data-view="progress">Прогресс</button>
    <button id="tab-bank" data-view="bank">Банк</button>
  </nav>
</header>
<main id="app"></main>
</div>

<script>
/* ===================== ДАННЫЕ ===================== */
const BLOCKS={
  fin:{n:"Финансовая отчётность",k:5},

  dig:{n:"Цифровая трансформация, платформы, тренды",k:2}
};
const TYPE={all:"Выберите все подходящие варианты",one:"Выберите один вариант ответа",wrong:"Выберите 1 НЕВЕРНЫЙ ответ"};
// b: блок, t: тип, q: вопрос, o: варианты, a: индексы верных, e: пояснение, u: 1 = ответ не из слайдов, сверить; p: 1 = вопрос с фото экзамена
const BANK=[
// ---------- ФИНАНСЫ ----------
{b:"fin",t:"one",p:1,q:"Что не относится к оборотным активам?",o:["Краткосрочные финансовые вложения","Запасы и затраты","Дебиторская задолженность","Денежные средства","Кредиторская задолженность","Все варианты верные, всё относится"],a:[4],e:"Кредиторская задолженность — это обязательство (мы должны), а не актив."},
{b:"fin",t:"all",p:1,q:"Что из перечисленного относится к внеоборотным активам?",o:["Нераспределённая прибыль","Незавершённые капитальные вложения","Нематериальные активы","Основные средства","Уставный капитал","Долгосрочные финансовые вложения"],a:[1,2,3,5],e:"Нераспределённая прибыль и уставный капитал — это капитал (пассив)."},
{b:"fin",t:"all",p:1,q:"Что из перечисленного относится к краткосрочным обязательствам?",o:["Краткосрочные займы","Дебиторская задолженность","Краткосрочные кредиты","Кредиторская задолженность","Нераспределённая прибыль"],a:[0,2,3],e:"Дебиторская задолженность — актив (нам должны), нераспределённая прибыль — капитал."},
{b:"fin",t:"all",p:1,q:"Что из перечисленного относится к отчёту о финансовых результатах?",o:["Расходы","Доходы","Обязательства","Инвестиции собственников","Распределения собственникам","Убыток","Прибыль"],a:[0,1,5,6],e:"Обязательства — баланс; инвестиции и распределения собственникам — отчёт об изменениях капитала."},
{b:"fin",t:"all",p:1,q:"Если говорить о финансовых отчётах, что относится к отчётам об изменениях?",o:["Отчёт о финансовых результатах","Бухгалтерский баланс","Отчёт о движении денежных средств","Отчёт об изменениях капитала"],a:[0,2,3],e:"Баланс — «снимок» на дату. Остальные три показывают изменения за период."},
{b:"fin",t:"all",p:1,q:"Что из перечисленного относится к одношаговому отчёту о финансовых результатах?",o:["Прибыль до налогообложения","Валовая прибыль","Дивидендный доход","Выручка от продаж","Прибыль от продаж"],a:[0,2,3],e:"В одношаговом отчёте все доходы суммируются, все расходы вычитаются разом. Промежуточных итогов (валовая прибыль, прибыль от продаж) нет."},
{b:"fin",t:"all",q:"Что из перечисленного относится к оборотным активам?",o:["Запасы","Основные средства","Дебиторская задолженность","Краткосрочные финансовые вложения","Нематериальные активы","Денежные средства"],a:[0,2,3,5],e:"Основные средства и НМА служат дольше года — это внеоборотные активы."},
{b:"fin",t:"all",q:"Что относится к разделу «Капитал и резервы»?",o:["Уставный капитал","Нераспределённая прибыль","Кредиторская задолженность","Добавочный капитал","Долгосрочные займы"],a:[0,1,3],e:"Кредиторская задолженность и займы — обязательства."},
{b:"fin",t:"all",q:"Какие промежуточные показатели есть в многошаговом отчёте о финансовых результатах, но отсутствуют в одношаговом?",o:["Валовая прибыль","Прибыль от продаж","Выручка","Прибыль до налогообложения","Чистая прибыль"],a:[0,1],e:"Выручка, прибыль до налога и чистая прибыль есть в обоих форматах."},
{b:"fin",t:"one",q:"Какой отчёт показывает финансовое положение компании на определённую дату?",o:["Отчёт о финансовых результатах","Бухгалтерский баланс","Отчёт о движении денежных средств","Отчёт об изменениях капитала"],a:[1],e:"Баланс фиксирует активы, обязательства и капитал на дату."},
{b:"fin",t:"all",q:"Что относится к элементам бухгалтерского баланса (а не отчёта о финансовых результатах)?",o:["Активы","Обязательства","Капитал","Доходы","Расходы"],a:[0,1,2],e:"Доходы и расходы — элементы ОФР."},
{b:"fin",t:"all",q:"На какие виды деятельности делятся потоки в отчёте о движении денежных средств?",o:["Текущие (операционные)","Инвестиционные","Финансовые","Валовые","Нематериальные"],a:[0,1,2],e:"ОДДС: текущая, инвестиционная и финансовая деятельность."},
{b:"fin",t:"one",q:"Какое уравнение лежит в основе бухгалтерского баланса?",o:["Активы = Доходы − Расходы","Активы = Обязательства + Капитал","Капитал = Активы + Обязательства","Прибыль = Активы − Обязательства"],a:[1],e:"Основное балансовое уравнение."},
{b:"fin",t:"one",q:"Что не относится к внеоборотным активам?",o:["Основные средства","Нематериальные активы","Запасы","Долгосрочные финансовые вложения","Незавершённые капитальные вложения"],a:[2],e:"Запасы — оборотный актив."},
{b:"fin",t:"all",q:"Что отражается в отчёте об изменениях капитала?",o:["Инвестиции собственников","Распределения собственникам (дивиденды)","Чистая прибыль за период","Дебиторская задолженность","Себестоимость продаж"],a:[0,1,2],e:"Чистая прибыль увеличивает нераспределённую прибыль, то есть капитал."},
{b:"fin",t:"one",q:"К какому разделу относится нераспределённая прибыль?",o:["Оборотные активы","Краткосрочные обязательства","Капитал","Доходы"],a:[2],e:"Раздел «Капитал и резервы»."},
{b:"fin",t:"one",q:"Чем одношаговый отчёт о финансовых результатах отличается от многошагового?",o:["В нём нет выручки","Все доходы и все расходы сгруппированы вместе, прибыль считается одним вычитанием","В нём показывают активы и обязательства","Он составляется только для банков"],a:[1],e:"Нет промежуточных итогов."},
{b:"fin",t:"wrong",q:"К оборотным активам относятся…",o:["Денежные средства","Запасы","Краткосрочные финансовые вложения","Долгосрочные финансовые вложения"],a:[3],e:"Долгосрочные вложения — внеоборотный актив."},
// ---------- ПРОХОРОВ ----------
{b:"proh",t:"all",p:1,u:1,q:"Какие из перечисленных черт А. П. Прохоров относит к особенностям русской модели управления?",o:["Неправовой характер государства и управления","Наличие параллельных структур управления","Чередование стабильных и нестабильных периодов функционирования системы","Постоянное стремление к конкуренции на всех уровнях управления","Преобладание горизонтальных связей над вертикальными"],a:[0,1,2],e:"В русской модели преобладают вертикальные связи, а конкуренция не является её основой."},
{b:"proh",t:"all",p:1,u:1,q:"Какие перспективы развития русской модели управления видит А. П. Прохоров?",o:["Усиление роли кластерных единиц и их превращение в ключевые звенья системы управления","Сохранение модели в неизменном виде","Её дальнейшее развитие с сохранением ключевых инструментов (мобилизация и перераспределение ресурсов, чередование режимов)","Постепенное снижение ключевой роли государства","Полная замена модели на более современную"],a:[0,2],e:"Прохоров не предлагает ни застыть, ни полностью заменить модель: она развивается, сохраняя свои инструменты."},
{b:"proh",t:"all",p:1,u:1,q:"Какие факторы, по Прохорову, могут способствовать компромиссу между потребностями людей и особенностями русской модели при переходе к новому этапу?",o:["Усиление роли государства и возврат к полностью централизованному управлению","Радикальное изменение законодательства и отказ от традиционных механизмов","Развитие механизмов обратной связи между системой управления и обществом","Эволюция общественного сознания и новое отношение людей к роли государства, предприятий и себя","Постепенное повышение самостоятельности кластерных единиц и учёт локальных интересов"],a:[2,3,4],e:"Крайности (полная централизация или радикальный слом) компромисса не дают."},
{b:"proh",t:"all",u:1,q:"Какие инструменты управления, по Прохорову, характерны для русской модели?",o:["Мобилизация ресурсов","Перераспределение ресурсов","Чередование режимов функционирования системы","Опора на независимый суд и верховенство права","Свободная конкуренция на всех уровнях"],a:[0,1,2],e:"Верховенство права и конкуренция — черты западной модели."},
{b:"proh",t:"all",u:1,q:"Какую роль, по Прохорову, выполняет уравниловка в русской модели управления?",o:["Обеспечивает выживание системы и минимальный уровень для всех","Стимулирует индивидуальную конкуренцию и рост производительности","Снижает социальную напряжённость внутри коллективов","Полностью заменяет формальные правила управления"],a:[0,2],e:"Уравниловка — механизм выживания, а не стимул к эффективности."},
{b:"proh",t:"all",u:1,q:"Чем, по Прохорову, русская модель управления отличается от западной?",o:["Неправовым характером государства и управления","Наличием параллельных (формальных и неформальных) структур","Верховенством закона над решениями руководителей","Чередованием мобилизационных и стабильных периодов","Опорой на рыночную конкуренцию"],a:[0,1,3],e:"C и E описывают западную модель."},
{b:"proh",t:"all",u:1,q:"Что, по Прохорову, происходит в мобилизационный период функционирования системы?",o:["Концентрация власти в центре","Перераспределение ресурсов на приоритетные цели","Рост самостоятельности кластерных единиц","Жёсткий контроль и централизованные решения"],a:[0,1,3],e:"Самостоятельность кластерных единиц растёт в стабильный период."},
{b:"proh",t:"all",u:1,q:"Что характерно для стабильного режима функционирования русской модели управления?",o:["Ослабление контроля центра","Рост самостоятельности кластерных единиц","Накопление неэффективности, «застой»","Жёсткая мобилизация всех ресурсов"],a:[0,1,2],e:"Мобилизация — противоположный режим."},
{b:"proh",t:"one",u:1,q:"Что Прохоров называет параллельными структурами управления?",o:["Филиалы компании в разных регионах","Неформальные механизмы, которые дублируют формальные и позволяют системе работать в обход неработающих правил","Две конкурирующие политические партии","Совет директоров и правление"],a:[1],e:"Формальные правила работают плохо, поэтому система опирается на неформальные связи."},
{b:"proh",t:"one",u:1,q:"Почему систему управления в русской модели называют «маятниковой»?",o:["Она постоянно копирует западные образцы","Она циклически переходит от мобилизационного режима к стабильному и обратно","Она меняет руководителя каждые четыре года","Она балансирует между рынком и планом в равных долях"],a:[1],e:"Маятник: мобилизация (рывок, централизация) → стабилизация (децентрализация, застой) → новая мобилизация."},

{b:"burg",t:"all",p:1,q:"Какие факторы необходимо учитывать при внедрении ИИ в бизнес-процессы компании?",o:["Возможность полного исключения человеческого фактора из всех процессов","Необходимость подготовки и предоставления экспертных знаний о собственных процессах","Гарантированную мгновенную окупаемость инвестиций в ИИ-решения","Потребность в обеспечении прозрачности и объяснимости решений ИИ","Риски, связанные с конфиденциальностью данных и соблюдением законодательства"],a:[1,3,4],e:"Полное исключение человека и мгновенная окупаемость — мифы."},
{b:"burg",t:"all",p:1,q:"Какие проблемы могут возникнуть при внедрении ИИ и как их можно решить?",o:["Неправильный выбор технологии — тщательный анализ бизнес-задач и консультации с экспертами в ИИ","Недостаток прозрачности алгоритмов — более объяснимые модели и инструменты интерпретации","«Плохие» данные — игнорирование данных низкого качества","«Наивность» ИИ — постоянное обновление и дообучение моделей на новых данных","Зависимость от высококвалифицированных специалистов — полный отказ от ИИ"],a:[0,1,3],e:"Плохие данные нужно очищать, а не игнорировать. Отказ от ИИ — не решение."},
{b:"burg",t:"all",p:1,u:1,q:"Согласно Берджессу, какие технологии часто используются вместе с ИИ для оптимизации бизнес-процессов?",o:["RPA (Robotic Process Automation)","Системы управления базами данных","Облачные технологии","Технологии виртуальной реальности","Интернет вещей (IoT)"],a:[0,2,4],e:"RPA автоматизирует рутину, облака дают вычисления, IoT — данные с устройств. VR к оптимизации процессов в книге не относится."},

{b:"burg",t:"all",u:1,q:"Согласно Берджессу, какие способности ИИ относятся к группе «понять, что происходит»?",o:["Понимание естественного языка","Оптимизация","Прогнозирование","Распознавание изображений","Кластеризация"],a:[0,1,2],e:"Распознавание изображений и кластеризация — «сбор информации»."},
{b:"burg",t:"all",q:"Что компании нужно подготовить перед внедрением ИИ?",o:["Качественные и доступные данные","Понимание бизнес-задачи, которую решает ИИ","План полного отказа от сотрудников","Поддержку высшего руководства","Стратегию ИИ, связанную со стратегией компании"],a:[0,1,3,4],e:"ИИ дополняет людей, а не требует их полного увольнения."},

 {q:"Кофейня у вуза: пост «капучино для студентов за 150 ₽» с красивым фото, но напиток не похож на фото, гости жалуются. Кто отвечает и в чём проблема?",plan:["Функцию маркетинга выполняет каждый, кто касается клиента","Пост — сбытовая функция, бариста — товарная, владелец — управление и контроль","Проблема: нет стандарта и контроля обещания","Решение: стандарт продукта, согласование обещаний, обратная связь"]},
 {q:"Производитель одежды отказался от устойчивой повестки, чтобы сократить затраты; инвесторы снизили ESG-рейтинг, крупный ритейлер требует отчёт об ответственной цепочке поставок. Какая проблема?",plan:["Краткосрочный фокус против долгосрочной ценности","Стейкхолдеры: инвесторы, клиенты B2B, сообщества","Ответственная цепочка поставок: кодекс поставщика, ESG-пункты в договорах (Норникель)","Компромисс: приоритетные направления, прозрачность"]},
 {q:"Основатель стартапа сам делает продажи, продукт и отчётность; компания растёт, сроки срываются, команда ждёт указаний. Какая проблема по Адизесу?",plan:["Ловушка основателя: стиль P/E без A и I","Нужны администратор (процессы) и интегратор (команда)","Делегирование: «силами других людей» (Фоллетт)","Переход к следующей стадии жизненного цикла"]}
]};
const OPEN_ORDER=[["trend","Тенденции и данные"],["book","Книги курса"],["bio","Биография лидера (ИПР)"],["cse","Мини-кейс"]];

/* ===================== СОСТОЯНИЕ ===================== */
const KEY="pos-trainer-v1";
let S={attempts:[],qstats:{},current:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let view=S.current?"exam":"home";
let bankFilter="all";

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const L="ABCDEFGH";
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function weight(i){const st=S.qstats[i];if(!st)return 3;const acc=st.c/st.n;return 1+ (1-acc)*4 + (st.n<2?1:0);}
function pickWeighted(pool,k,r){const out=[];let p=pool.slice();for(let x=0;x<k&&p.length;x++){const tot=p.reduce((s,i)=>s+weight(i),0);let v=r()*tot;let idx=0;for(;idx<p.length;idx++){v-=weight(p[idx]);if(v<=0)break;}idx=Math.min(idx,p.length-1);out.push(p[idx]);p.splice(idx,1);}return out;}

function newVariant(mode){
  const seed=Math.floor(Math.random()*9000)+1000;const r=rng(seed);
  let ids=[];
  if(mode==="mistakes"){
    const bad=Object.keys(S.qstats).map(Number).filter(i=>S.qstats[i].last===0);
    ids=shuffle(bad,r).slice(0,20);
    if(ids.length<20){const rest=BANK.map((_,i)=>i).filter(i=>!ids.includes(i));ids=ids.concat(pickWeighted(rest,20-ids.length,r));}
  }else{
    for(const b in BLOCKS){const pool=BANK.map((q,i)=>q.b===b?i:-1).filter(i=>i>=0);ids=ids.concat(pickWeighted(pool,BLOCKS[b].k,r));}
    ids=shuffle(ids,r);
  }
  const qs=ids.map(i=>({i,order:shuffle(BANK[i].o.map((_,k)=>k),r),sel:[]}));
  const open=OPEN_ORDER.map(([c])=>({c,k:Math.floor(r()*OPEN[c].length),text:"",score:null,shown:false}));
  S.current={seed,mode:mode||"exam",qs,open,checked:false,started:Date.now()};
  save();view="exam";render();window.scrollTo(0,0);
}
function isCorrect(q){const b=BANK[q.i];const s=q.sel.slice().sort((a,c)=>a-c),a=b.a.slice().sort((x,y)=>x-y);return s.length===a.length&&s.every((v,k)=>v===a[k]);}
function check(){
  const c=S.current;c.checked=true;let closed=0;const byBlock={};
  c.qs.forEach(q=>{const ok=isCorrect(q);if(ok)closed++;const b=BANK[q.i].b;byBlock[b]=byBlock[b]||[0,0];byBlock[b][1]++;if(ok)byBlock[b][0]++;
    const st=S.qstats[q.i]||{n:0,c:0,last:0};st.n++;if(ok)st.c++;st.last=ok?1:0;S.qstats[q.i]=st;});
  c.result={closed,byBlock};save();render();
  const el=document.getElementById("result");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
}
function finish(){
  const c=S.current;const open=c.open.reduce((s,o)=>s+(o.score||0),0);
  S.attempts.push({date:new Date().toISOString(),seed:c.seed,mode:c.mode,closed:c.result.closed,open,openScored:c.open.every(o=>o.score!==null),byBlock:c.result.byBlock});
  S.current=null;save();view="progress";render();window.scrollTo(0,0);
}

/* ===================== ОТРИСОВКА ===================== */
const app=document.getElementById("app");
function setTabs(){document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.view===view?"true":"false"));}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;render();window.scrollTo(0,0);}));

function render(){setTabs();({home:renderHome,exam:renderExam,progress:renderProgress,bank:renderBank})[view]();}

function summary(){
  const n=S.attempts.length;const totals=S.attempts.map(a=>a.closed+a.open);
  const best=n?Math.max(...totals):0;const seen=Object.keys(S.qstats).length;
  const mastered=Object.values(S.qstats).filter(s=>s.last===1&&s.c>=2).length;
  return {n,best,seen,mastered,last:n?totals[n-1]:null};
}
function renderHome(){
  const s=summary();const bad=Object.values(S.qstats).filter(x=>x.last===0).length;
  app.innerHTML=`
  <section class="section">
    <div><h1>Пробный экзамен за 2 минуты</h1>
    <p class="lead">Каждый вариант собирается заново из банка в ${BANK.length} закрытых и ${Object.values(OPEN).flat().length} открытых вопросов, в той же пропорции, что на фото экзамена. Вопросы, где ты ошибаешься, попадаются чаще.</p></div>
    <div class="stats">
      <div class="stat"><b>${s.n}</b><span>вариантов решено</span></div>
      <div class="stat"><b>${s.last===null?"—":s.last}</b><span>последний балл из 40</span></div>
      <div class="stat"><b>${s.best||"—"}</b><span>лучший балл</span></div>
      <div class="stat"><b>${s.mastered}/${BANK.length}</b><span>вопросов освоено</span></div>
    </div>
    <div class="panel section" style="margin-top:0">
      <div class="label">Новый вариант</div>
      <div class="row">
        <button class="btn primary" id="go-exam">Сгенерировать вариант</button>
        <button class="btn" id="go-mist" ${bad?"":"disabled"}>Работа над ошибками${bad?` · ${bad}`:""}</button>
        ${S.current?`<button class="btn" id="go-cont">Продолжить вариант №${S.current.seed}</button>`:""}
      </div>
      <p class="hint" style="margin:0">Формат: 20 закрытых вопросов по 1 баллу + 4 открытых по 5 баллов. Порог 16 из 40. Открытые оцениваешь сама по плану ответа.</p>
    </div>
    <div class="panel">
      <div class="label" style="margin-bottom:10px">Из чего собирается часть 1</div>
      <div class="blocks">${Object.entries(BLOCKS).map(([k,b])=>`<div class="brow"><span>${b.n}</span><div class="bar"><i style="width:${b.k*20}%"></i></div><span class="num">${b.k} из 20</span></div>`).join("")}</div>
      <p class="hint" style="margin-top:12px">Вопросы с пометкой <span class="chip warn">сверить</span> составлены по книгам, а не по слайдам: проверь ответ по конспекту.</p>
    </div>
  </section>`;
  document.getElementById("go-exam").onclick=()=>newVariant("exam");
  const m=document.getElementById("go-mist");if(m)m.onclick=()=>newVariant("mistakes");
  const cc=document.getElementById("go-cont");if(cc)cc.onclick=()=>{view="exam";render();};
}

function renderExam(){
  const c=S.current;
  if(!c){app.innerHTML=`<section class="section"><div class="panel"><h2>Варианта нет</h2><p class="lead">Сгенерируй новый, чтобы начать.</p><div class="row" style="margin-top:12px"><button class="btn primary" id="g">Сгенерировать вариант</button></div></div></section>`;document.getElementById("g").onclick=()=>newVariant("exam");return;}
  const answered=c.qs.filter(q=>q.sel.length).length;
  let h=`<div class="examhead"><div><div class="label">${c.mode==="mistakes"?"Работа над ошибками":"Вариант"}</div><h2>№ ${c.seed}</h2></div><div class="bar" title="Отвечено"><i style="width:${answered*5}%"></i></div><span class="qn">${answered}/20</span></div>`;
  h+=`<section class="section"><div class="label">Часть 1 · закрытые вопросы</div>`;
  c.qs.forEach((q,n)=>{const b=BANK[q.i];const multi=b.t==="all";
    let cls="q";if(c.checked)cls+=isCorrect(q)?" ok":" no";
    h+=`<div class="${cls}"><div class="qtop"><span class="qn">${n+1} · ${BLOCKS[b.b].n}</span><span>${b.p?'<span class="chip">с экзамена</span> ':""}${b.u?'<span class="chip warn">сверить</span>':""}</span></div>
    <div class="qt">${esc(b.q)}</div><div class="hint">${b.t==="wrong"?"Выберите <b>1 НЕВЕРНЫЙ</b> ответ":TYPE[b.t]}</div><div class="opts">`;
    q.order.forEach((oi,pos)=>{const sel=q.sel.includes(oi);let oc="opt";
      if(c.checked){if(b.a.includes(oi))oc+=" right";else if(sel)oc+=" wrongpick";}else if(sel)oc+=" sel";
      const id=`q${n}o${pos}`;
      h+=`<label class="${oc}" for="${id}"><input type="${multi?"checkbox":"radio"}" id="${id}" name="q${n}" data-q="${n}" data-o="${oi}" ${sel?"checked":""} ${c.checked?"disabled":""}><span class="ltr">${L[pos]}</span><span>${esc(b.o[oi])}</span></label>`;});
    h+=`</div>`;
    if(c.checked)h+=`<div class="expl"><b>${isCorrect(q)?"Верно.":"Ответ: "+b.a.map(a=>L[q.order.indexOf(a)]).sort().join(", ")+"."}</b> ${esc(b.e)}${b.u?' <span class="u">Сверь по конспекту.</span>':""}</div>`;
    h+=`</div>`;});
  h+=`<div class="label" style="margin-top:8px">Часть 2 · открытые вопросы</div>`;
  c.open.forEach((o,n)=>{const item=OPEN[o.c][o.k];
    h+=`<div class="q"><div class="qtop"><span class="qn">${21+n} · ${OPEN_ORDER[n][1]}</span><span class="qn">5 баллов</span></div><div class="qt">${esc(item.q)}</div>
    <label class="hint" for="ta${n}">Твой ответ (черновик сохраняется)</label><textarea id="ta${n}" data-open="${n}" placeholder="Тезис → 3–4 аргумента с терминами курса → пример → вывод">${esc(o.text)}</textarea>
    <div class="row"><button class="btn" data-plan="${n}">${o.shown?"Скрыть план ответа":"Показать план ответа"}</button></div>`;
    if(o.shown)h+=`<div class="plan"><div class="label">Что должно быть в ответе</div><ul>${item.plan.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
      <div class="label" style="margin-top:10px">Оцени себя</div><div class="selfscore">${[0,1,2,3,4,5].map(v=>`<button data-score="${n}" data-v="${v}" aria-pressed="${o.score===v}">${v}</button>`).join("")}</div></div>`;
    h+=`</div>`;});
  if(!c.checked){h+=`<div class="panel row" style="justify-content:space-between"><span class="hint">Отвечено ${answered} из 20 закрытых. Пустые засчитаются как ошибка.</span><button class="btn primary" id="check">Проверить часть 1</button></div>`;}
  else{const op=c.open.reduce((s,o)=>s+(o.score||0),0);const tot=c.result.closed+op;const scored=c.open.every(o=>o.score!==null);
    h+=`<div class="panel" id="result"><div class="result"><div><div class="label">Итого</div><div class="big ${tot>=16?"pass":"fail"}">${tot}<span style="font-size:20px;color:var(--muted)">/40</span></div></div>
    <div><div>Закрытые: <b>${c.result.closed}/20</b></div><div>Открытые: <b>${op}/20</b>${scored?"":" <span class='hint'>(оцени все 4 по плану)</span>"}</div><div>Оценка за экзамен: <b>${(tot/4).toFixed(2)}</b></div><div class="${tot>=16?"pass":"fail"}">${tot>=16?"Порог 16 пройден":"Ниже порога 16"}</div></div></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="finish">Сохранить в прогресс</button><button class="btn" id="discard">Не сохранять</button></div></div>`;}
  h+=`</section>`;
  app.innerHTML=h;
  app.querySelectorAll("input[data-q]").forEach(inp=>inp.addEventListener("change",()=>{const q=c.qs[+inp.dataset.q];const b=BANK[q.i];const oi=+inp.dataset.o;
    if(b.t==="all"){q.sel=inp.checked?[...new Set(q.sel.concat(oi))]:q.sel.filter(x=>x!==oi);}else q.sel=[oi];save();
    const y=window.scrollY;render();window.scrollTo(0,y);}));
  app.querySelectorAll("textarea[data-open]").forEach(t=>t.addEventListener("input",()=>{c.open[+t.dataset.open].text=t.value;save();}));
  app.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>{const o=c.open[+b.dataset.plan];o.shown=!o.shown;save();const y=window.scrollY;render();window.scrollTo(0,y);});
  app.querySelectorAll("[data-score]").forEach(b=>b.onclick=()=>{c.open[+b.dataset.score].score=+b.dataset.v;save();const y=window.scrollY;render();window.scrollTo(0,y);});
  const ch=document.getElementById("check");if(ch)ch.onclick=check;
  const f=document.getElementById("finish");if(f)f.onclick=finish;
  const d=document.getElementById("discard");if(d)d.onclick=()=>{S.current=null;save();view="home";render();};
}

function chart(){
  const pts=S.attempts.slice(-15).map(a=>a.closed+a.open);if(pts.length<2)return `<p class="empty">График появится после двух сохранённых вариантов.</p>`;
  const W=640,H=200,pl=34,pr=12,pt=12,pb=26,x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=v=>pt+(1-v/40)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Баллы по попыткам">`;
  [0,10,20,30,40].forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;});
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(16)}" y2="${y(16)}" stroke="var(--bad)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-pr}" y="${y(16)-5}" text-anchor="end">порог 16</text>`;
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`;
  pts.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===pts.length-1?5:3.5}" fill="var(--accent)"/>`;});
  pts.forEach((v,i)=>{s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${S.attempts.length-pts.length+i+1}</text>`;});
  return s+`</svg>`;
}
function renderProgress(){
  const s=summary();const agg={};Object.keys(BLOCKS).forEach(b=>agg[b]=[0,0]);
  for(const i in S.qstats){const b=BANK[i]&&BANK[i].b;if(!b)continue;agg[b][0]+=S.qstats[i].c;agg[b][1]+=S.qstats[i].n;}
  const weak=Object.entries(agg).filter(([,v])=>v[1]).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1])[0];
  app.innerHTML=`<section class="section">
   <div><h1>Прогресс</h1><p class="lead">${s.n?`Решено вариантов: ${s.n}. ${weak?`Слабее всего блок «${BLOCKS[weak[0]].n}» — ${Math.round(weak[1][0]/weak[1][1]*100)}% верных.`:""}`:"Здесь появится статистика после первого сохранённого варианта."}</p></div>
   <div class="stats">
     <div class="stat"><b>${s.n}</b><span>вариантов</span></div>
     <div class="stat"><b>${s.best||"—"}</b><span>лучший балл из 40</span></div>
     <div class="stat"><b>${s.seen}/${BANK.length}</b><span>вопросов встречено</span></div>
     <div class="stat"><b>${s.mastered}</b><span>освоено (верно ≥2 раз и в последний)</span></div>
   </div>
   <div class="panel"><div class="label" style="margin-bottom:8px">Баллы по попыткам</div>${chart()}</div>
   <div class="panel"><div class="label" style="margin-bottom:10px">Точность по блокам (закрытые вопросы)</div><div class="blocks">
    ${Object.entries(agg).map(([b,v])=>{const p=v[1]?Math.round(v[0]/v[1]*100):null;return `<div class="brow"><span>${BLOCKS[b].n}</span><div class="bar"><i style="width:${p||0}%;background:${p===null?"var(--line)":p>=70?"var(--good)":p>=50?"var(--warn)":"var(--bad)"}"></i></div><span class="num">${p===null?"—":p+"%"}</span></div>`;}).join("")}
   </div></div>
   <div class="panel"><div class="label" style="margin-bottom:8px">История</div>${S.attempts.length?`<div class="hist"><table><thead><tr><th>№</th><th>Дата</th><th>Вариант</th><th>Закр.</th><th>Откр.</th><th>Итого</th></tr></thead><tbody>
    ${S.attempts.slice().reverse().map((a,k)=>{const t=a.closed+a.open;return `<tr><td class="n">${S.attempts.length-k}</td><td>${new Date(a.date).toLocaleDateString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</td><td class="n">${a.seed}${a.mode==="mistakes"?" · ошибки":""}</td><td class="n">${a.closed}/20</td><td class="n">${a.open}/20</td><td class="n ${t>=16?"pass":"fail"}"><b>${t}</b></td></tr>`;}).join("")}
   </tbody></table></div>`:`<p class="empty">Пока пусто.</p>`}</div>
   <div class="row"><button class="btn primary" id="np">Новый вариант</button><button class="btn" id="reset">Сбросить прогресс</button></div>
   <p class="hint" id="resetnote" hidden></p>
   <p class="hint">Прогресс хранится в этом браузере на этом устройстве.</p>
  </section>`;
  document.getElementById("np").onclick=()=>newVariant("exam");
  const r=document.getElementById("reset");let armed=false;r.onclick=()=>{if(!armed){armed=true;r.textContent="Нажми ещё раз, чтобы стереть всё";return;}S={attempts:[],qstats:{},current:null};save();render();};
}

function renderBank(){
  const list=BANK.map((q,i)=>({q,i})).filter(x=>bankFilter==="all"||(bankFilter==="photo"?x.q.p:x.q.b===bankFilter));
  app.innerHTML=`<section class="section"><div><h1>Банк вопросов</h1><p class="lead">Все закрытые вопросы с ответами — для повторения перед вариантом.</p></div>
  <div class="row"><label class="hint" for="bf">Блок</label><select id="bf"><option value="all">Все (${BANK.length})</option><option value="photo">С фото экзамена</option>${Object.entries(BLOCKS).map(([k,b])=>`<option value="${k}">${b.n}</option>`).join("")}</select></div>
  <div class="panel">${list.map(({q,i})=>{const st=S.qstats[i];return `<div class="bankq"><div class="qtop"><span class="qn">${BLOCKS[q.b].n}</span><span>${q.p?'<span class="chip">с экзамена</span> ':""}${q.u?'<span class="chip warn">сверить</span> ':""}${st?`<span class="qn">${st.c}/${st.n}</span>`:""}</span></div><div class="qt">${esc(q.q)}</div><div class="ans">${q.a.map(a=>esc(q.o[a])).join(" · ")}</div><div class="hint">${esc(q.e)}</div></div>`;}).join("")}</div></section>`;
  const sel=document.getElementById("bf");sel.value=bankFilter;sel.onchange=()=>{bankFilter=sel.value;renderBank();};
}
render();
</script>
